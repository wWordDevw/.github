<svg xmlns="http://www.w3.org/2000/svg" width="800" height="960" viewBox="0 0 800 960" role="img" aria-labelledby="title desc">
  <title id="title">WordDev — We build digital futures</title>
  <desc id="desc">Un equipo construye productos digitales alrededor del símbolo de WordDev.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070711"/><stop offset=".55" stop-color="#17163d"/><stop offset="1" stop-color="#071b2c"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8b8dfb"/><stop offset=".52" stop-color="#6366f1"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fb7185"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#6366f1" stop-opacity=".5"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#818cf8" stroke-opacity=".08"/></pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="clip"><rect width="800" height="960" rx="34"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="800" height="960" fill="url(#bg)"/>
    <rect width="800" height="960" fill="url(#grid)"/>
    <circle cx="400" cy="600" r="370" fill="url(#halo)"/>
    <g fill="#c7d2fe"><circle cx="60" cy="81" r="2"/><circle cx="705" cy="61" r="3"/><circle cx="747" cy="273" r="2"/><circle cx="98" cy="344" r="3"/><circle cx="680" cy="425" r="2"/></g>
    <g stroke="#818cf8" opacity=".3"><path d="M40 195 138 139 225 171" fill="none"/><path d="M586 111 682 153 750 120" fill="none"/></g>

    <g transform="translate(251 56)">
      <rect width="72" height="72" rx="18" fill="url(#brand)"/>
      <path d="M14 18 23 55 32 33 36 47 40 33 49 55 58 18" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="36" cy="62" r="3.5" fill="#fff"/>
      <text x="91" y="32" fill="#fafafa" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">Word<tspan fill="#818cf8">Dev</tspan></text>
      <text x="92" y="55" fill="#a5b4fc" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="3">DIGITAL STUDIO</text>
    </g>

    <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
      <text x="400" y="205" fill="#fafafa" font-size="56" font-weight="800" letter-spacing="-2">WE BUILD</text>
      <text x="400" y="270" fill="url(#brand)" font-size="56" font-weight="800" letter-spacing="-2">DIGITAL FUTURES</text>
      <text x="400" y="322" fill="#c7c7d3" font-size="20">Ideas que se convierten en productos</text>
      <text x="400" y="350" fill="#c7c7d3" font-size="20">digitales listos para crecer.</text>
    </g>

    <!-- Floating product cards -->
    <g transform="translate(66 405) rotate(-7)">
      <rect width="176" height="112" rx="17" fill="#171936" stroke="#818cf8" stroke-opacity=".65"/>
      <rect x="1" y="1" width="174" height="28" rx="15" fill="#252653"/><circle cx="17" cy="15" r="4" fill="#fb7185"/><circle cx="30" cy="15" r="4" fill="#fbbf24"/><circle cx="43" cy="15" r="4" fill="#34d399"/>
      <rect x="18" y="47" width="60" height="47" rx="8" fill="url(#brand)"/><rect x="94" y="49" width="57" height="7" rx="3.5" fill="#a5b4fc"/><rect x="94" y="67" width="43" height="6" rx="3" fill="#667085"/><rect x="94" y="82" width="50" height="6" rx="3" fill="#667085"/>
    </g>
    <g transform="translate(592 400)"><path d="M24 63C7 63 0 53 0 41s9-22 21-24C28 1 47-3 59 8c8-6 18-5 25 2 7 6 9 16 6 24 12 2 20 11 20 22 0 14-10 23-27 23H24Z" fill="#182149" stroke="#22d3ee" stroke-width="2"/><path d="m38 44 13-13 13 13M51 32v29" fill="none" stroke="#67e8f9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>

    <!-- Digital landscape -->
    <path d="M25 787c42-84 118-117 211-97 45-101 165-141 265-82 96-22 205 51 228 158l-37 156H72Z" fill="#12183b" stroke="#6366f1" stroke-opacity=".35" stroke-width="2"/>
    <ellipse cx="400" cy="617" rx="289" ry="180" fill="none" stroke="#818cf8" stroke-width="2" stroke-dasharray="8 13" opacity=".35" transform="rotate(-7 400 617)"/>

    <!-- Central WordDev core -->
    <g transform="translate(300 480)">
      <circle cx="100" cy="100" r="112" fill="#6366f1" opacity=".14"/>
      <circle cx="100" cy="100" r="83" fill="#111733" stroke="#818cf8" stroke-width="3"/>
      <rect x="61" y="61" width="78" height="78" rx="20" fill="url(#brand)"/>
      <path d="M74 79 83 119 93 94 100 111 107 94 117 119 126 79" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="100" cy="128" r="4" fill="#fff"/>
      <g fill="#a5b4fc"><circle cx="100" cy="10" r="4"/><circle cx="100" cy="190" r="4"/><circle cx="10" cy="100" r="4"/><circle cx="190" cy="100" r="4"/></g>
    </g>

    <!-- Left teammate -->
    <g transform="translate(118 613)">
      <circle cx="76" cy="43" r="38" fill="#efb18d"/><path d="M38 39C38 8 55-5 78-2c20 2 34 17 35 40-22-13-49-16-75 1Z" fill="#261d43"/><circle cx="64" cy="46" r="3" fill="#27223d"/><circle cx="89" cy="46" r="3" fill="#27223d"/><path d="M68 61c6 5 12 5 18 0" fill="none" stroke="#955445" stroke-width="3" stroke-linecap="round"/>
      <path d="M22 154c4-55 24-81 54-81s51 26 55 81Z" fill="#4f46e5"/><path d="m51 80 25 25 25-25" fill="#fff"/>
      <rect x="-2" y="114" width="154" height="87" rx="11" fill="#0b1024" stroke="#818cf8" stroke-width="2"/><path d="m36 145-12 11 12 11m81-22 12 11-12 11m-34-25-10 29" fill="none" stroke="#67e8f9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Right teammate -->
    <g transform="translate(529 618)">
      <circle cx="68" cy="41" r="37" fill="#8e543d"/><path d="M31 43C26 11 44-5 69-1c25 4 36 24 31 49-10-18-23-27-39-30-6 14-15 22-30 25Z" fill="#17182e"/><circle cx="57" cy="45" r="3" fill="#241c20"/><circle cx="81" cy="45" r="3" fill="#241c20"/><path d="M60 60c6 4 12 4 18 0" fill="none" stroke="#5d3026" stroke-width="3" stroke-linecap="round"/>
      <path d="M18 153c4-54 22-80 50-80s48 26 52 80Z" fill="#0891b2"/><path d="m45 80 23 23 23-23" fill="#fff"/>
      <rect x="-22" y="113" width="169" height="88" rx="11" fill="#10152e" stroke="#22d3ee" stroke-opacity=".7" stroke-width="2"/><circle cx="16" cy="143" r="10" fill="#fb7185"/><rect x="38" y="134" width="78" height="8" rx="4" fill="#a5b4fc"/><rect x="38" y="155" width="61" height="7" rx="3.5" fill="#667085"/>
    </g>

    <!-- Rocket -->
    <g transform="translate(654 191) rotate(20)"><path d="M39 4c28 24 29 65 8 100L24 84C37 48 34 29 39 4Z" fill="#e0e7ff"/><path d="M39 4c28 24 29 65 8 100l-11-11c14-29 15-58 3-89Z" fill="#818cf8"/><circle cx="45" cy="43" r="9" fill="#07182b" stroke="#22d3ee" stroke-width="4"/><path d="m24 84-15 18 24 1zm23 20 7 22 14-25z" fill="#f43f5e"/><path d="m25 102 4 38 13-30 8 27 3-34z" fill="url(#warm)" filter="url(#glow)"/></g>

    <g transform="translate(112 889)" font-family="Arial, Helvetica, sans-serif"><circle cx="5" cy="-5" r="5" fill="#34d399" filter="url(#glow)"/><text x="22" fill="#aeb4c3" font-size="12" font-weight="700" letter-spacing="1.2">FROM COLOMBIA · BUILDING FOR EVERYWHERE</text></g>
  </g>
  <rect x="1" y="1" width="798" height="958" rx="33" fill="none" stroke="#818cf8" stroke-opacity=".24" stroke-width="2"/>
</svg>
