    <g transform="translate(116 407)"><circle r="39" fill="#6366f1"/><path d="m-12-2 8-8m-8 8 8 8m16-16-8 8m8-8-8-8" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/><text x="70" y="-5" fill="#fafafa" font-size="23" font-weight="700">Desarrollo</text><text x="70" y="25" fill="#8b93a7" font-size="17">Diseñar, programar y probar</text></g>
