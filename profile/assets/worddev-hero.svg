      <rect width="82" height="82" rx="20" fill="#181b39" stroke="#fbbf24" stroke-opacity=".58"/>
      <path d="M22 29h38l-4 31H26Zm6 0 5-11h17l5 11" fill="none" stroke="#fde68a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="34" cy="65" r="3" fill="#fde68a"/><circle cx="51" cy="65" r="3" fill="#fde68a"/>
    </g>
    <g transform="translate(716 325)">
      <rect width="72" height="72" rx="18" fill="#181b39" stroke="#fb7185" stroke-opacity=".55"/>
      <path d="M18 51 29 39l9 8 16-24" fill="none" stroke="#fda4af" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M47 23h7v8" fill="none" stroke="#fda4af" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- Foreground lights -->
    <ellipse cx="1110" cy="622" rx="420" ry="34" fill="#6366f1" opacity=".18" filter="url(#soft)"/>
    <g fill="#818cf8" opacity=".45"><circle cx="724" cy="570" r="3"/><circle cx="829" cy="603" r="2"/><circle cx="1429" cy="557" r="3"/><circle cx="1510" cy="523" r="2"/></g>
  </g>
  <rect x="1" y="1" width="1598" height="638" rx="31" fill="none" stroke="#818cf8" stroke-opacity=".22" stroke-width="2"/>
</svg>
