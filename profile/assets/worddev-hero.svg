    <path d="M684 490c72-45 159-64 253-50 60-62 179-80 270-34 71-22 176 8 218 78l-36 102H731Z" fill="url(#ground)" stroke="#6366f1" stroke-opacity=".28" stroke-width="2"/>
    <path d="M730 527c176-36 445-35 655 1" fill="none" stroke="#818cf8" stroke-opacity=".22"/>

    <!-- Central product orb -->
    <g transform="translate(1072 294)">
      <circle cx="87" cy="87" r="105" fill="#6366f1" opacity=".13" filter="url(#soft)"/>
      <circle cx="87" cy="87" r="77" fill="#101735" stroke="#818cf8" stroke-width="3"/>
      <circle cx="87" cy="87" r="64" fill="url(#brand)" opacity=".16"/>
      <rect x="51" y="46" width="72" height="72" rx="18" fill="url(#brand)"/>
      <path d="M64 63 73 101 82 78 87 93 92 78 101 101 110 63" fill="none" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="87" cy="107" r="3.5" fill="white"/>
      <g fill="#a5b4fc"><circle cx="87" cy="2" r="4"/><circle cx="87" cy="172" r="4"/><circle cx="2" cy="87" r="4"/><circle cx="172" cy="87" r="4"/></g>
    </g>

    <!-- Team member left: strategy -->
    <g transform="translate(790 345)">
      <path d="M38 48c-10-30 3-50 31-50 24 0 38 15 35 42-19-10-42-11-66 8Z" fill="#20254d"/>
      <circle cx="70" cy="49" r="36" fill="#f2b38f"/>
      <path d="M38 42c3-29 21-40 40-39 16 1 26 9 30 23-18 5-45-2-70 16Z" fill="#251c45"/>
      <circle cx="58" cy="51" r="3" fill="#27223d"/><circle cx="82" cy="51" r="3" fill="#27223d"/>
      <path d="M62 65c6 5 12 5 18 0" fill="none" stroke="#9a5947" stroke-width="3" stroke-linecap="round"/>
      <path d="M24 153c3-52 21-76 46-76s45 24 49 76Z" fill="#4f46e5"/>
      <path d="M48 82 70 106 92 82" fill="#f8fafc"/>
      <rect x="-1" y="116" width="112" height="67" rx="9" fill="#12182f" stroke="#818cf8" stroke-opacity=".6"/>
      <path d="M38 143h9l8 8-8 8h-9m36-16h-9l-8 8 8 8h9" fill="none" stroke="#67e8f9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Team member right: design -->
    <g transform="translate(1274 352)">
      <circle cx="72" cy="45" r="36" fill="#8f553e"/>
      <path d="M34 49C28 15 47-3 72 1c25 4 37 24 31 51-10-19-23-28-40-31-5 15-14 23-29 28Z" fill="#17182e"/>
      <circle cx="60" cy="50" r="3" fill="#241c20"/><circle cx="84" cy="50" r="3" fill="#241c20"/>
      <path d="M63 64c6 4 12 4 18 0" fill="none" stroke="#5d3026" stroke-width="3" stroke-linecap="round"/>
      <path d="M22 156c3-53 22-79 50-79s48 26 52 79Z" fill="#0891b2"/>
      <path d="M49 83 72 106 95 83" fill="#f8fafc"/>
      <rect x="34" y="109" width="126" height="80" rx="11" fill="#171936" stroke="#22d3ee" stroke-opacity=".58"/>
      <circle cx="65" cy="137" r="10" fill="#fb7185"/><rect x="85" y="127" width="52" height="7" rx="3.5" fill="#a5b4fc"/>
      <rect x="56" y="157" width="81" height="7" rx="3.5" fill="#475569"/>
    </g>

    <!-- Team member center/front: engineering -->
    <g transform="translate(979 402)">
      <circle cx="72" cy="39" r="38" fill="#b97552"/>
      <path d="M33 39C30 8 47-7 72-4c25 2 39 20 36 47-10-13-19-22-28-27-13 14-28 21-47 23Z" fill="#261c31"/>
      <path d="M38 35c-10 5-10 23 2 25m65-25c10 5 10 23-2 25" fill="#b97552"/>
      <circle cx="59" cy="43" r="3" fill="#2c2020"/><circle cx="84" cy="43" r="3" fill="#2c2020"/>
      <path d="M64 57c6 5 12 5 18 0" fill="none" stroke="#73402e" stroke-width="3" stroke-linecap="round"/>
      <path d="M17 158c5-58 23-83 55-83s51 25 56 83Z" fill="#312e81"/>
      <path d="m49 81 23 23 23-23" fill="#f8fafc"/>
      <rect x="-20" y="111" width="184" height="91" rx="12" fill="#0b1024" stroke="#818cf8" stroke-width="2"/>
      <rect x="-6" y="125" width="156" height="54" rx="6" fill="#121936"/>
      <path d="m25 143-11 10 11 10m96-20 11 10-11 10m-58-23-10 27" fill="none" stroke="#67e8f9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
