<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-labelledby="title desc">
  <title id="title">WordDev — We build digital futures</title>
  <desc id="desc">Una escena digital nocturna donde un equipo construye productos alrededor del símbolo de WordDev.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070711"/>
      <stop offset="0.48" stop-color="#10102a"/>
      <stop offset="1" stop-color="#071629"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8b8dfb"/>
      <stop offset="0.52" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fb7185"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#23245a"/>
      <stop offset="1" stop-color="#0c1025"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#6366f1" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#6366f1" stop-opacity=".13"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#818cf8" stroke-opacity=".075"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <clipPath id="sceneClip"><rect x="0" y="0" width="1600" height="640" rx="32"/></clipPath>
  </defs>

  <g clip-path="url(#sceneClip)">
    <rect width="1600" height="640" fill="url(#bg)"/>
    <rect width="1600" height="640" fill="url(#grid)"/>
    <ellipse cx="1170" cy="306" rx="530" ry="390" fill="url(#halo)"/>
    <circle cx="1318" cy="92" r="122" fill="#06b6d4" opacity=".09" filter="url(#soft)"/>
    <circle cx="748" cy="610" r="180" fill="#f43f5e" opacity=".07" filter="url(#soft)"/>

    <!-- Stars and network points -->
    <g fill="#c7d2fe">
      <circle cx="54" cy="76" r="2" opacity=".5"/><circle cx="315" cy="44" r="2" opacity=".35"/>
      <circle cx="575" cy="91" r="3" opacity=".55"/><circle cx="724" cy="48" r="2" opacity=".6"/>
      <circle cx="932" cy="78" r="2" opacity=".4"/><circle cx="1123" cy="40" r="3" opacity=".7"/>
      <circle cx="1454" cy="64" r="2" opacity=".45"/><circle cx="1533" cy="178" r="3" opacity=".55"/>
      <circle cx="667" cy="205" r="2" opacity=".45"/><circle cx="1490" cy="394" r="2" opacity=".55"/>
    </g>
    <g stroke="#818cf8" stroke-width="1.5" opacity=".22">
      <path d="M720 91 807 132 893 72 1008 126 1123 40" fill="none"/>
      <path d="M1318 92 1417 142 1533 178" fill="none"/>
    </g>
    <g fill="#818cf8" filter="url(#glow)">
      <circle cx="807" cy="132" r="4"/><circle cx="1008" cy="126" r="4"/>
      <circle cx="1417" cy="142" r="4"/>
    </g>

    <!-- Brand block -->
    <g transform="translate(96 84)">
      <rect width="74" height="74" rx="18" fill="url(#brand)"/>
      <path d="M15 18 24 56 33 33 37 48 41 33 50 56 59 18" fill="none" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="37" cy="62" r="3.5" fill="white"/>
      <text x="94" y="32" fill="#fafafa" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" letter-spacing="-.5">Word<tspan fill="#818cf8">Dev</tspan></text>
      <text x="95" y="55" fill="#a5b4fc" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="3.4">DIGITAL STUDIO</text>
    </g>

    <g font-family="Arial, Helvetica, sans-serif">
      <text x="96" y="235" fill="#fafafa" font-size="58" font-weight="800" letter-spacing="-2.5">WE BUILD</text>
      <text x="96" y="300" fill="url(#brand)" font-size="58" font-weight="800" letter-spacing="-2.5">DIGITAL FUTURES</text>
      <text x="99" y="349" fill="#c7c7d3" font-size="20" font-weight="400">Transformamos ideas en productos digitales</text>
      <text x="99" y="378" fill="#c7c7d3" font-size="20" font-weight="400">funcionales, escalables y preparados para crecer.</text>
    </g>

    <g transform="translate(96 424)" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">
      <g><rect width="107" height="34" rx="17" fill="#6366f1" opacity=".16" stroke="#818cf8" stroke-opacity=".6"/><text x="20" y="22" fill="#c7d2fe">STRATEGY</text></g>
      <g transform="translate(119)"><rect width="92" height="34" rx="17" fill="#06b6d4" opacity=".12" stroke="#22d3ee" stroke-opacity=".5"/><text x="22" y="22" fill="#a5f3fc">DESIGN</text></g>
      <g transform="translate(223)"><rect width="82" height="34" rx="17" fill="#f43f5e" opacity=".1" stroke="#fb7185" stroke-opacity=".5"/><text x="22" y="22" fill="#fecdd3">CODE</text></g>
      <g transform="translate(317)"><rect width="97" height="34" rx="17" fill="#f59e0b" opacity=".1" stroke="#fbbf24" stroke-opacity=".5"/><text x="18" y="22" fill="#fde68a">LAUNCH</text></g>
    </g>

    <g transform="translate(98 520)" font-family="Arial, Helvetica, sans-serif">
      <circle cx="6" cy="-5" r="5" fill="#34d399" filter="url(#glow)"/>
      <text x="22" y="0" fill="#9ca3af" font-size="13" font-weight="600" letter-spacing="1.4">FROM COLOMBIA · BUILDING FOR EVERYWHERE</text>
    </g>

    <!-- Distant digital city -->
    <g opacity=".52">
      <path d="M678 485V315h62v170zm74 0V259h82v226zm94 0V339h56v146zm67 0V214h96v271zm108 0V293h64v192zm76 0V235h112v250zm126 0V326h65v159zm77 0V266h86v219zm99 0V355h62v130z" fill="#111936"/>
