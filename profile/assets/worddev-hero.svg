      </g>
    </g>

    <!-- Orbit behind the team -->
    <ellipse cx="1160" cy="343" rx="368" ry="194" fill="none" stroke="#818cf8" stroke-width="2" stroke-dasharray="7 13" opacity=".35" transform="rotate(-8 1160 343)"/>
    <circle cx="844" cy="238" r="7" fill="#22d3ee" filter="url(#glow)"/>
    <circle cx="1445" cy="385" r="7" fill="#fb7185" filter="url(#glow)"/>

