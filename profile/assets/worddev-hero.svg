      <circle cx="17" cy="14" r="4" fill="#fb7185"/><circle cx="30" cy="14" r="4" fill="#fbbf24"/><circle cx="43" cy="14" r="4" fill="#34d399"/>
      <rect x="18" y="47" width="66" height="51" rx="8" fill="url(#brand)" opacity=".8"/>
      <rect x="98" y="48" width="64" height="8" rx="4" fill="#818cf8"/>
      <rect x="98" y="65" width="49" height="6" rx="3" fill="#667085"/>
      <rect x="98" y="79" width="57" height="6" rx="3" fill="#667085"/>
    </g>

    <!-- Cloud node -->
    <g transform="translate(1285 196)">
      <path d="M29 67C9 67 0 56 0 42c0-14 10-25 24-27C31-1 52-5 65 7c8-6 20-5 28 2 8 7 10 18 6 27 13 2 22 12 22 25 0 15-11 25-29 25H29Z" fill="#1e2550" stroke="#22d3ee" stroke-opacity=".65" stroke-width="2"/>
      <path d="m44 47 14-14 14 14m-14-13v33" fill="none" stroke="#67e8f9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

