<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="230" viewBox="0 0 1400 230" role="img" aria-labelledby="title desc">
  <title id="title">Proceso de trabajo WordDev</title>
  <desc id="desc">Descubrimiento, estrategia, desarrollo, lanzamiento y crecimiento.</desc>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#6366f1"/><stop offset="1" stop-color="#f43f5e"/></linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1400" height="230" rx="26" fill="#0d0e19"/>
  <path d="M136 99H1264" stroke="#25284d" stroke-width="10" stroke-linecap="round"/>
  <path d="M136 99H1264" stroke="url(#line)" stroke-width="3" stroke-linecap="round"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <g transform="translate(136 99)"><circle r="32" fill="#11182f" stroke="#22d3ee" stroke-width="3"/><circle r="6" fill="#22d3ee" filter="url(#glow)"/><text y="66" fill="#fafafa" font-size="18" font-weight="700">Descubrimiento</text><text y="90" fill="#8b93a7" font-size="13">Entender antes de construir</text></g>
    <g transform="translate(418 99)"><circle r="32" fill="#151633" stroke="#818cf8" stroke-width="3"/><circle r="6" fill="#818cf8" filter="url(#glow)"/><text y="66" fill="#fafafa" font-size="18" font-weight="700">Estrategia</text><text y="90" fill="#8b93a7" font-size="13">Producto y arquitectura</text></g>
    <g transform="translate(700 99)"><circle r="38" fill="#6366f1"/><path d="m-12-2 8-8m-8 8 8 8m16-16-8 8m8-8-8-8" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text y="70" fill="#fafafa" font-size="18" font-weight="700">Desarrollo</text><text y="94" fill="#8b93a7" font-size="13">Diseñar, programar, probar</text></g>
    <g transform="translate(982 99)"><circle r="32" fill="#291a32" stroke="#fb7185" stroke-width="3"/><circle r="6" fill="#fb7185" filter="url(#glow)"/><text y="66" fill="#fafafa" font-size="18" font-weight="700">Lanzamiento</text><text y="90" fill="#8b93a7" font-size="13">Desplegar y optimizar</text></g>
    <g transform="translate(1264 99)"><circle r="32" fill="#2d2419" stroke="#fbbf24" stroke-width="3"/><circle r="6" fill="#fbbf24" filter="url(#glow)"/><text y="66" fill="#fafafa" font-size="18" font-weight="700">Crecimiento</text><text y="90" fill="#8b93a7" font-size="13">Medir, aprender, evolucionar</text></g>
  </g>
  <rect x="1" y="1" width="1398" height="228" rx="25" fill="none" stroke="#818cf8" stroke-opacity=".2" stroke-width="2"/>
